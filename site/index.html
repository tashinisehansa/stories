<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">

  <meta property="og:type" content="website">

<body class="library-page">
  <main id="main">
    <header class="library-header">
      <h1>Tashini&#39;s Story World</h1>
      <p class="welcome">Welcome to my collection of stories!</p>
      <div class="sort" hidden>
        <span id="sort-label">Show:</span>

        <button type="button" data-sort="oldest" aria-pressed="false">Oldest first</button>
      </div>
    </header>
    <ul class="story-list" aria-label="Stories">
      <li class="empty">The first story is coming soon!</li>
    </ul>
  </main>
  <footer class="site-footer">
    <p>Stories written by Tashini</p>
  </footer>
