name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/stories/**", "site/index.html", "site/stories.json"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, workflow and API tests
        run: npm test
      - name: Validate the public site
        run: npm run validate:site
